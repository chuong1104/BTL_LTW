<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanyPet Chatbot</title>
    <link rel="stylesheet" href="css/chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            <div class="chatbot-title">
                <img src="images/logo.png" alt="JanyPet Logo" class="chatbot-logo">
                <span>JanyPet Hỗ trợ</span>
            </div>
            <div class="chatbot-actions">
                <button class="minimize-btn"><i class="fas fa-minus"></i></button>
                <button class="clear-btn" title="Xóa cuộc trò chuyện"><i class="fas fa-trash"></i></button>
                <button class="close-btn"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="chatbot-body">
            <div class="messages-container" id="messages">
                <div class="message bot">
                    <div class="message-content">
                        Xin chào! Tôi là trợ lý ảo của JanyPet. Tôi có thể giúp gì cho bạn về các sản phẩm và dịch vụ dành cho thú cưng?
                    </div>
                    <span class="time">12:00</span>
                </div>
            </div>
        </div>
    </div>
    <div class="chatbot-footer">
        <form id="chatbot-form">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Nhập tin nhắn của bạn..." required>
                <button type="submit"><i class="fas fa-paper-plane"></i></button>
            </div>
        </form>
        <div class="powered-by">Powered by JanyPet</div>
    </div>
</div>

<!-- Chatbot toggle button -->
<button class="chatbot-toggle">
    <i class="fas fa-comments"></i>
</button>
<script src="js/chatbot.js"></script>
</body>
</html
