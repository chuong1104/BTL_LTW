<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanyPet - Kết quả thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        .content-area { flex: 1; }
        .status-icon { font-size: 4rem; margin-bottom: 1rem; }
        .success { color: #198754; }
        .failed { color: #dc3545; }
        .pending { color: #ffc107; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <!-- You can include your standard header here if needed -->
    <header class="auto-hide-header">
        <div class="container py-2">
          <div class="row py-3 align-items-center">
            <div class="col-lg-3 col-md-4 col-sm-6 text-center text-sm-start">
              <div class="main-logo">
                <a href="index.html">
                  <img src="images/logo.png" alt="JanyPet" class="img-fluid" style="max-height: 60px">
                </a>
              </div>
            </div>
          </div>
        </div>
    </header>

    <div class="container content-area py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div id="payment-status-container">
                    <!-- Content will be injected by script -->
                </div>
                <div class="mt-4">
                    <a href="/" class="btn btn-primary me-2">Về trang chủ</a>
                    <a href="/order-history.html" id="viewOrderLink" class="btn btn-outline-secondary" style="display:none;">Xem đơn hàng</a>
                </div>
            </div>
        </div>
    </div>

    <!-- You can include your standard footer here if needed -->
    <footer id="footer" class="bg-light pt-3 pb-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; <span id="currentYear"></span> JanyPet. Tất cả quyền được bảo lưu.</p>
        </div>
    </footer>
    <script src="js/checkout-handler.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status'); // 'success', 'failed', 'cancelled'
            const messageCode = params.get('message'); // 'SUCCESS', 'USER_CANCELLED', 'FAILED', etc.
            const orderId = params.get('orderId');
            const amount = params.get('amount'); // VNPAY amount (VND * 100)
            const rspCode = params.get('rspCode'); // VNPAY response code

            const container = document.getElementById('payment-status-container');
            const viewOrderLink = document.getElementById('viewOrderLink');
            let htmlContent = '';

            if (orderId) {
                viewOrderLink.href = `/order-details.html?orderId=${orderId}`; // Adjust if you have a different order detail page
                viewOrderLink.style.display = 'inline-block';
            }

            if (status === 'success' && rspCode === '00') {
                htmlContent = `
                    <i class="fas fa-check-circle status-icon success"></i>
                    <h2>Thanh toán thành công!</h2>
                    <p>Cảm ơn bạn đã đặt hàng. Đơn hàng <strong>#${orderId || 'N/A'}</strong> của bạn đã được thanh toán thành công.</p>
                    <p>Chúng tôi sẽ xử lý đơn hàng của bạn sớm nhất có thể.</p>
                `;
                
                // Xóa sản phẩm khỏi giỏ hàng sau khi thanh toán VNPAY thành công
                if (typeof clearCartAndResetForm === 'function') {
                    clearCartAndResetForm(null);
                } else {
                    // Fallback nếu hàm clearCartAndResetForm không tồn tại
                    const orderedItemsString = sessionStorage.getItem('itemsForCheckout');
                    
                    if (orderedItemsString) {
                        const orderedItems = JSON.parse(orderedItemsString);
                        let mainCart = JSON.parse(localStorage.getItem('cart')) || [];

                        // Lọc ra các sản phẩm đã đặt hàng (có trong itemsForCheckout) khỏi giỏ hàng chính
                        const orderedItemSignatures = orderedItems.map(item => `${item.id}-${item.variant || ''}`);
                        mainCart = mainCart.filter(cartItem => {
                            const cartItemSignature = `${cartItem.id}-${cartItem.variant || ''}`;
                            return !orderedItemSignatures.includes(cartItemSignature);
                        });
                        
                        // Cập nhật lại localStorage với giỏ hàng mới
                        localStorage.setItem('cart', JSON.stringify(mainCart));
                    } else {
                        // Nếu không tìm thấy itemsForCheckout, xóa toàn bộ giỏ hàng (fallback)
                        localStorage.removeItem('cart');
                    }
                    
                    // Xóa các dữ liệu liên quan đến thanh toán
                    sessionStorage.removeItem('itemsForCheckout');
                    sessionStorage.removeItem('checkoutTotal');
                    localStorage.removeItem('couponDiscount');
                    localStorage.removeItem('couponCode');
                    localStorage.removeItem('freeShipping');
                    localStorage.removeItem('shippingMethod');
                    localStorage.removeItem('paymentMethod');
                }
                
                // Cập nhật số lượng sản phẩm hiển thị trên biểu tượng giỏ hàng
                updateCartBadgeCount();

            } else if (status === 'cancelled' || rspCode === '24') {
                 htmlContent = `
                    <i class="fas fa-exclamation-triangle status-icon pending"></i>
                    <h2>Giao dịch đã bị hủy.</h2>
                    <p>Đơn hàng <strong>#${orderId || 'N/A'}</strong> chưa được thanh toán do bạn đã hủy giao dịch.</p>
                    <p>Nếu bạn muốn thử lại, vui lòng quay lại giỏ hàng và tiến hành thanh toán lại.</p>
                `;
            } else { // failed or unknown
                htmlContent = `
                    <i class="fas fa-times-circle status-icon failed"></i>
                    <h2>Thanh toán không thành công.</h2>
                    <p>Đã có lỗi xảy ra trong quá trình thanh toán cho đơn hàng <strong>#${orderId || 'N/A'}</strong>.</p>
                    <p>Mã lỗi VNPAY: ${rspCode || 'N/A'}. Vui lòng thử lại hoặc chọn phương thức thanh toán khác.</p>
                    <p>Nếu bạn cần hỗ trợ, vui lòng liên hệ với chúng tôi.</p>
                `;
            }
            container.innerHTML = htmlContent;

            // Thêm hàm updateCartBadgeCount nếu chưa có
            function updateCartBadgeCount() {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
                
                const badges = document.querySelectorAll('.fa-shopping-cart + .badge');
                badges.forEach(badge => {
                    badge.textContent = itemCount;
                });
            }
        });
    </script>
</body>
</html>
